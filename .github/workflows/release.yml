name: release

# Builds the Windows and macOS packages and publishes them as one GitHub Release, so end
# users can install vaultis by downloading it rather than by compiling it.
#
# This exists because compiling on the user's machine turned out not to be possible
# without a separate multi-gigabyte toolchain install. Every toolchain rustup can
# install unaided fails to LINK on a clean Windows box, each in its own way:
#   msvc     - needs link.exe, which ships with Visual Studio
#   gnu      - ships ld and dlltool but no assembler, so the windows-* crates'
#              `raw-dylib` imports fail inside dlltool
#   gnullvm  - needs an external llvm-mingw (x86_64-w64-mingw32-clang)
# A GitHub windows-latest runner already has MSVC, so the compile happens HERE, once,
# where the toolchain is a solved problem - and get_vaultis.bat just downloads.
# The macOS package is built on a macos-latest runner for the same reason, and for one
# more: only a Mac can run lipo, codesign and notarytool.
#
# Cut a release by pushing a tag:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ['v*']
  # Build and upload the zip as a workflow artifact WITHOUT publishing a release, to
  # check the packaging end to end before committing to a tag.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # required to create the release

jobs:
  windows:
    name: windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The first job in this repo that actually LINKS a Windows binary. ci.yml's
      # windows job only `cargo check`s from an ubuntu runner, which is why four
      # consecutive link-time failures reached users instead of CI.
      - name: Build the release binaries
        run: cargo build --release -p vaultis --bins

      # The practice vault an installed copy offers behind the lock screen's "Sample
      # vault" button. It is built HERE for the same reason the binaries are: the only
      # thing that can produce one is `seed_sample_vault`, a cargo example that needs the
      # toolchain and is not compiled into the shipped binaries. Without this step the
      # button is dead on every installed copy, since nothing else on a user's machine
      # ever writes a sample vault (see launch::sample_vault_dir).
      #
      # Everything in it is fiction, and its two passwords are the publicly-known
      # sample1/sample2 — that is the point, and it is why the vault is a throwaway that
      # must never hold anything real. Adds ~30KB to a 13MB zip.
      - name: Seed the sample vault
        run: cargo run --release -p vaultis --example seed_sample_vault -- stage/vaultis/sample-vault sample1 sample2

      # Everything make-shortcuts.ps1 needs, in one flat folder: it already prefers
      # icons sitting beside the exe when given -InstallDir, which is exactly the
      # layout get_vaultis.bat extracts to. The sample vault is the one SUBdirectory,
      # which is where launch::sample_vault_dir looks on an installed copy.
      - name: Stage the package
        shell: pwsh
        run: |
          $Stage = 'stage/vaultis'
          New-Item -ItemType Directory -Path $Stage -Force | Out-Null
          Copy-Item target/release/vaultis-gui.exe        $Stage
          Copy-Item target/release/vaultis.exe            $Stage
          Copy-Item packaging/icons/vaultis-locked.ico    $Stage
          Copy-Item packaging/icons/vaultis-unlocked.ico  $Stage
          Copy-Item packaging/windows/make-shortcuts.ps1  $Stage
          # Shipped so an installed copy can update or relocate itself without going back
          # to GitHub for the script first -- `get_vaultis.bat v0.2.4` from the install
          # folder upgrades in place. It is also why the installer stages the copy that is
          # currently executing as get_vaultis.bat.new and swaps it in on exit.
          Copy-Item get_vaultis.bat                       $Stage

          # The single-writer lock file the seeder leaves behind. It is session state, not
          # vault content: shipping one would put a stale lock in every install, and the
          # vault opens identically without it.
          Remove-Item "$Stage/sample-vault/vaultis.lock" -Force -ErrorAction SilentlyContinue

          # Fail the release rather than ship a package that is quietly missing something.
          # A dead "Sample vault" button is invisible until a user clicks where it isn't.
          foreach ($Required in 'vaultis.exe', 'vaultis-gui.exe', 'vaultis-locked.ico',
                                'vaultis-unlocked.ico', 'make-shortcuts.ps1',
                                'get_vaultis.bat', 'sample-vault/vault.pmv') {
              if (-not (Test-Path -LiteralPath "$Stage/$Required")) {
                  throw "the staged package is missing $Required"
              }
          }
          Get-ChildItem $Stage -Recurse | Select-Object FullName, Length

      - name: Zip it, with a checksum
        shell: pwsh
        run: |
          # A tag build names itself after the tag; a manual dispatch has no tag, so it
          # is labelled by commit instead of borrowing a version number it is not.
          $Version = if ($env:GITHUB_REF -like 'refs/tags/*') {
              $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
              'dev-' + $env:GITHUB_SHA.Substring(0, 8)
          }
          $Zip = "vaultis-$Version-windows-x86_64.zip"
          Compress-Archive -Path stage/vaultis/* -DestinationPath $Zip
          # Published beside the zip so get_vaultis.bat can verify what it downloaded.
          # Format matches `sha256sum`: "<hex>  <filename>".
          $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Zip).Hash.ToLowerInvariant()
          "$Hash  $Zip" | Set-Content -LiteralPath "$Zip.sha256" -Encoding ascii
          Write-Host "$Hash  $Zip"
          "ZIP=$Zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # On a manual dispatch this is the whole output: download it from the run page and
      # check the packaging before tagging anything.
      - uses: actions/upload-artifact@v4
        with:
          name: vaultis-windows-x86_64
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          if-no-files-found: error

  macos:
    name: macos universal
    runs-on: macos-latest
    env:
      # All optional. Without them the app is signed ad hoc and not notarized, which
      # runs when installed by get_vaultis.bat (curl sets no quarantine flag) but is
      # blocked by Gatekeeper when the zip is downloaded in a browser. With them:
      #   MACOS_CERTIFICATE_P12       base64 of the "Developer ID Application" .p12
      #   MACOS_CERTIFICATE_PASSWORD  its export password
      #   MACOS_SIGN_IDENTITY         e.g. "Developer ID Application: Name (TEAMID)"
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool (an app-specific
      #                               password from appleid.apple.com, not the real one)
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # One universal app rather than one per architecture: nobody downloading an estate
      # vault should have to know which chip their Mac has.
      - name: Build both architectures and join them
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p vaultis --bins --target "$t"
          done
          mkdir -p stage/bin
          for b in vaultis vaultis-gui; do
            lipo -create -output "stage/bin/$b" \
              "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
          done
          lipo -info stage/bin/vaultis-gui

      # The same practice vault the Windows package ships; see that job's comment.
      - name: Seed the sample vault
        run: cargo run --release -p vaultis --example seed_sample_vault -- stage/sample-vault sample1 sample2

      - name: Version label
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"
          fi

      # A throwaway keychain holding only the signing certificate, so codesign can reach
      # it without a password prompt. Skipped entirely when no certificate is configured.
      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PW=$(uuidgen)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build vaultis.app
        run: |
          # make-app.sh signs with MACOS_SIGN_IDENTITY only when a certificate was
          # imported; otherwise ad hoc.
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then unset MACOS_SIGN_IDENTITY; fi
          packaging/macos/make-app.sh stage "$VERSION" stage/bin/vaultis-gui stage/bin/vaultis stage/sample-vault

      - name: Notarize
        if: env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_ID != ''
        run: |
          ditto -c -k --keepParent stage/vaultis.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple stage/vaultis.app

      - name: Zip it, with a checksum
        run: |
          ZIP="vaultis-$VERSION-macos-universal.zip"
          # ditto, not zip: it keeps the bundle's extended attributes and the stapled
          # notarization ticket, and is what Finder itself uses.
          ditto -c -k --keepParent stage/vaultis.app "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: vaultis-macos-universal
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          if-no-files-found: error

  # One release, created once both packages exist: a release that appeared with only
  # the Windows zip would send `get_vaultis.bat` on a Mac to /releases/latest and find
  # nothing to install.
  publish:
    name: publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # get_vaultis.bat is attached on its own as well, so both platforms have one
      # stable URL to fetch it from:
      #   https://github.com/<repo>/releases/latest/download/get_vaultis.bat
      # and again, byte for byte, as get_vaultis.sh: the same installer under a name a
      # Mac user does not mistake for the Windows download (bash ignores the extension).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp get_vaultis.bat get_vaultis.sh
          gh release create "${{ github.ref_name }}" dist/* get_vaultis.bat get_vaultis.sh --generate-notes
