[package]
name = "vaultis"
version = "0.6.0"
edition = "2024"
publish = false # private application crate — never published to a registry
# Two binaries are built: the console `vaultis` (src/main.rs — the CLI) and
# the windowed `vaultis-gui` (src/bin/vaultis-gui.rs — Windows GUI subsystem,
# no console window). `default-run` keeps `cargo run`/`cargo install` pointed at
# the console one. All vault logic lives in `vaultis-core`; this crate is the
# desktop shell (CLI + egui GUI) over it.
default-run = "vaultis"

# Explicit binaries so the windowed one can REQUIRE the `gui` feature: a
# `--no-default-features` build then produces ONLY the console `vaultis` (a
# CLI-only binary with no GUI/clipboard deps), which can be statically linked
# (musl) into a single self-contained file. See [features].
[[bin]]
name = "vaultis"
path = "src/main.rs"

[[bin]]
name = "vaultis-gui"
path = "src/bin/vaultis-gui.rs"
required-features = ["gui"]

[dependencies]
vaultis-core = { path = "../vaultis-core" }
anyhow = "1.0.102"
# Clipboard only; disable the default `image-data` feature (pulls a PNG/deflate
# image stack we never use) to shrink the dependency/attack surface. Optional and
# behind the `clipboard` feature: on Linux arboard dynamically loads the X11/Wayland
# libraries, so a fully-static (musl) build leaves it out.
arboard = { version = "3.6.1", default-features = false, optional = true }
directories = "6.0.0"
# The egui windowed GUI. Optional + behind the `gui` feature so a CLI-only build
# (and a static musl binary) doesn't pull in eframe and the desktop graphics stack.
eframe = { version = "0.34.3", optional = true }
# PNG decoding for the WINDOW ICON only (embedded at compile time from
# packaging/icons/). Adds nothing new to the dependency tree: eframe already pulls
# `png` transitively (eframe -> image -> png), so this is a direct edge to a crate
# that is compiled into the GUI build either way. Optional + tied to `gui` because a
# CLI-only/musl build has no window to put an icon on.
png = { version = "0.18.1", optional = true }
# Raw-mode, no-echo terminal input for the CLI's password prompts
# (`read_line_no_echo` in src/main.rs). Default features only.
crossterm = "0.29.0"
serde_json = "1.0.150"
zeroize = { version = "1.9.0", features = ["derive"] }

# Unix-only: `O_NOFOLLOW` for the single-instance lock file open (refuses a
# symlink atomically). Used only through the safe `OpenOptionsExt::custom_flags`
# API. No effect on Windows builds.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# ON by default: the full desktop build (egui GUI + OS clipboard). Build a minimal,
# self-contained CLI-only binary (subcommands, no interactive UI) with
# `--no-default-features`:
#   cargo build --release -p vaultis --bin vaultis --no-default-features
default = ["gui"]
# The egui windowed GUI. Pulls eframe (and, transitively, the desktop graphics stack)
# and implies `clipboard`. Required by the `vaultis-gui` binary.
gui = ["dep:eframe", "dep:png", "clipboard"]
# OS clipboard integration (arboard), used by the GUI's copy buttons. On Linux this
# dynamically loads X11/Wayland, so a fully-static (musl) CLI-only build leaves it OFF.
clipboard = ["dep:arboard"]
# Forward crash-safety fault injection down into vaultis-core so the hidden
# `__crashop` subcommand (and tests/crash_recovery.rs) exercise the real fault
# points. OFF by default. Enable with:
#   cargo test -p vaultis -p vaultis-core --features vaultis/fault-injection
fault-injection = ["vaultis-core/fault-injection"]

[dev-dependencies]
egui_kittest = "0.34"
